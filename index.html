<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>SimRace Scheduler | Планировщик гонок с уведомлениями</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(ellipse at 30% 10%, #0a0f1c, #03050b);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #edf2ff;
      padding-bottom: 48px;
    }

    .hero-header {
      background: linear-gradient(135deg, #020617 0%, #0b1120 100%);
      border-bottom: 1px solid #1e2a4a;
      padding: 16px 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .logo-area h1 {
      font-size: 1.65rem;
      font-weight: 800;
      background: linear-gradient(135deg, #e0ffb0, #a0ff40);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.3px;
    }

    .logo-area p {
      font-size: 0.7rem;
      color: #8e9bc0;
      letter-spacing: 0.3px;
    }

    .stats-badge {
      display: flex;
      gap: 20px;
      background: #0f1629cc;
      padding: 8px 20px;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid #2a385c;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-weight: 800;
      font-size: 1.2rem;
      color: #b3ff66;
    }

    .main-container {
      max-width: 1600px;
      margin: 24px auto 40px;
      padding: 0 24px;
    }

    .sim-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 28px;
      justify-content: center;
    }

    .sim-icon-card {
      background: #0c1222e6;
      border-radius: 28px;
      padding: 8px 20px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid #293453;
      backdrop-filter: blur(4px);
    }

    .sim-icon-card img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .sim-icon-card span {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .sim-icon-card.active {
      background: linear-gradient(135deg, #1b2b4b, #0d1830);
      border-color: #a5ff4e;
      box-shadow: 0 0 12px rgba(165, 255, 78, 0.3);
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      background: #0a1022aa;
      padding: 14px 20px;
      border-radius: 48px;
      backdrop-filter: blur(8px);
    }

    .search-box {
      flex: 2;
      min-width: 200px;
    }

    .search-box input {
      width: 100%;
      background: #010318;
      border: 1px solid #2f3b66;
      padding: 10px 16px;
      border-radius: 40px;
      color: white;
      font-weight: 500;
    }

    .category-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      flex: 3;
    }

    .pill {
      background: #111a2e;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.1s linear;
      border: 1px solid #2a3a60;
    }

    .pill.active-pill {
      background: #9cff4e;
      color: #071000;
      border-color: #cfff99;
      box-shadow: 0 0 6px #acff66;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-neon {
      background: #101a30;
      border: 1px solid #4e6e9e;
      padding: 8px 16px;
      border-radius: 32px;
      font-weight: 800;
      font-size: 0.75rem;
      cursor: pointer;
      transition: 0.1s;
      color: #cbd5ff;
    }

    .btn-neon.green {
      background: #9cff4e20;
      border-color: #9cff4e;
      color: #d5ffaa;
    }

    .btn-neon:hover {
      background: #1f2c50;
      transform: scale(0.97);
    }

    .race-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 22px;
      margin-top: 8px;
    }

    .race-card-modern {
      background: linear-gradient(145deg, #0f172f, #080e20);
      border-radius: 28px;
      border: 1px solid #253153;
      overflow: hidden;
      transition: all 0.2s;
      box-shadow: 0 12px 24px -12px rgba(0,0,0,0.6);
    }

    .race-card-modern:hover {
      transform: translateY(-4px);
      border-color: #6d8ddb;
    }

    .race-card-modern.reminded {
      border-color: #ffaa44;
      box-shadow: 0 0 12px rgba(255,170,68,0.3);
    }

    .race-preview {
      background: radial-gradient(ellipse at 30% 20%, #1b2342, #030617);
      padding: 18px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2b4a;
    }

    .sim-icon-sm {
      height: 42px;
      width: auto;
      max-width: 100px;
      filter: drop-shadow(0 2px 5px black);
    }

    .tag-next {
      background: #00000066;
      backdrop-filter: blur(4px);
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 800;
    }

    .race-info {
      padding: 16px;
    }

    .race-title {
      font-weight: 800;
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .track-name {
      font-size: 0.8rem;
      color: #9ca9d4;
      margin-bottom: 12px;
    }

    .meta-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .meta-badge {
      background: #141f3c;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .next-sessions {
      background: #050a18aa;
      border-radius: 20px;
      padding: 10px;
      margin: 12px 0;
    }

    .session-time {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      padding: 6px 0;
      border-bottom: 1px dashed #1f2b50;
    }

    .countdown-live {
      color: #ff8866;
      font-weight: 800;
    }

    .countdown-soon {
      color: #ffbb44;
    }

    .countdown-normal {
      color: #aaffaa;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .card-actions button {
      flex: 1;
      background: #0e162e;
      border: none;
      padding: 8px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 0.7rem;
      cursor: pointer;
      color: #c2ceff;
      transition: 0.1s;
    }

    .card-actions button.reminder-btn {
      background: #2a2a4a;
      color: #ffcc66;
    }

    .card-actions button.reminder-btn:hover {
      background: #ffaa33;
      color: #1a1a2a;
    }

    .card-actions button:hover {
      background: #1f2c50;
    }

    .notification-permission {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: linear-gradient(135deg, #ffaa33, #ff8833);
      color: #1a1a2a;
      padding: 12px 20px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 100;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      transition: 0.2s;
    }

    .notification-permission:hover {
      transform: scale(1.02);
      background: linear-gradient(135deg, #ffbb44, #ff9944);
    }

    .modal-schedule {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .modal-card {
      background: #0e142cee;
      border: 1px solid #4a6daa;
      border-radius: 40px;
      width: 90%;
      max-width: 680px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
    }

    .form-double {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-field label {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    input, select {
      background: #010622;
      border: 1px solid #2d4270;
      padding: 10px 14px;
      border-radius: 32px;
      color: white;
    }

    .cat-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    .cat-option {
      background: #101c38;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
    }

    .cat-option.selected-cat {
      background: #a2ff4a;
      color: #0a2100;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
    }

    .footer-info {
      margin-top: 36px;
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #6f7daa;
    }

    @media (max-width: 700px) {
      .form-double { grid-template-columns: 1fr; }
      .filter-bar { flex-direction: column; align-items: stretch; border-radius: 28px; }
      .action-buttons { justify-content: flex-start; }
      .race-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="hero-header">
  <div class="logo-area">
    <h1>🏁 RACE MAESTRO</h1>
    <p>умный планировщик с уведомлениями</p>
  </div>
  <div class="stats-badge" id="statsPanel">
    <div class="stat-item"><span class="stat-value" id="statTotal">0</span><br>активных</div>
    <div class="stat-item"><span class="stat-value" id="statSoon">0</span><br>ближайшие 30 мин</div>
  </div>
</div>

<div class="main-container">
  <div class="sim-strip" id="simSelector"></div>

  <div class="filter-bar">
    <div class="search-box">
      <input type="text" id="searchField" placeholder="🔍 Серия, трасса...">
    </div>
    <div class="category-pills" id="categoryFilterList"></div>
    <div class="action-buttons">
      <div class="btn-neon green" id="clearFiltersBtn">✖ Сброс</div>
      <div class="btn-neon" id="addRaceModalBtn">➕ Добавить</div>
      <div class="btn-neon" id="exportDataBtn">💾 JSON</div>
      <div class="btn-neon" id="importDataBtn">📂 Импорт</div>
    </div>
    <input type="file" id="importFileInput" style="display:none" accept=".json">
  </div>

  <div id="raceGridContainer" class="race-grid"></div>
  <div class="footer-info">
    <span>⏱️ Обновление в реальном времени · уведомления за 5 минут до старта</span>
    <span id="liveClock"></span>
  </div>
</div>

<!-- Кнопка запроса разрешения на уведомления -->
<div id="notificationBell" class="notification-permission" style="display: none;">
  🔔 Включить уведомления о гонках
</div>

<div id="raceModal" class="modal-schedule">
  <div class="modal-card">
    <h2 style="margin-bottom: 16px;" id="modalTitle">➕ Новая гонка</h2>
    <div class="form-double">
      <div class="form-field"><label>Симулятор</label><select id="modalSim"></select></div>
      <div class="form-field"><label>Серия</label><input id="modalSeries" placeholder="GT3 Sprint"></div>
      <div class="form-field"><label>Трасса</label><input id="modalTrack" placeholder="Spa Francorchamps"></div>
      <div class="form-field"><label>Рейтинг / Лицензия</label><input id="modalRating" placeholder="Rookie / C 2.5"></div>
      <div class="form-field"><label>Длительность (мин)</label><input id="modalDuration" type="number" value="20"></div>
      <div class="form-field"><label>Первый старт</label><input id="modalStart" type="datetime-local"></div>
      <div class="form-field"><label>Интервал (мин) — 0 = разово</label><input id="modalInterval" type="number" value="0"></div>
      <div class="form-field"><label>Действительно до (опц.)</label><input id="modalValidUntil" type="datetime-local"></div>
      <div class="form-field"><label>Исключить время (HH:MM, через запятую)</label><input id="modalExclude" placeholder="14:00, 18:30"></div>
    </div>
    <div style="margin: 12px 0 8px;"><label>Категории / классы:</label></div>
    <div id="modalCategorySelector" class="cat-selector"></div>
    <div style="display: flex; gap: 12px; margin-top: 8px;">
      <input type="text" id="newCatInput" placeholder="Новая категория (например, LMH)" style="flex:1;">
      <button class="btn-neon" id="addNewCategoryBtn" style="background:#141f3c;">➕ Добавить кат.</button>
    </div>

    <div class="modal-buttons">
      <button class="btn-neon" id="closeModalBtn">Отмена</button>
      <button class="btn-neon green" id="saveRaceBtn">Сохранить</button>
    </div>
  </div>
</div>

<script>
  // ------------------ DATA ------------------
  const SIMS = ["All races", "iRacing", "LMU", "AC Evo", "ACC", "AMS2", "AC", "Rennsport", "PMR"];
  const SIM_ICON_MAP = {
    "All races": "icons/all.png",
    "iRacing": "icons/iracing.png",
    "LMU": "icons/lmu.png",
    "AC Evo": "icons/ace.png",
    "ACC": "icons/acc.png",
    "AMS2": "icons/ams2.png",
    "AC": "icons/ac.png",
    "Rennsport": "icons/rennsport.png",
    "PMR": "icons/pmr.png"
  };
  
  const STORAGE_KEY = "RaceSchedulerPro_v4";
  const DEFAULT_CATEGORIES = ["PCUP", "Formula Vee", "M2", "LMP2", "GT3", "HY", "LMP3", "GT4", "Prototype"];

  let state = {
    races: [],
    categories: [...DEFAULT_CATEGORIES]
  };

  let activeSimFilter = "All races";
  let activeCategoriesSet = new Set();
  let searchQuery = "";
  let editingRaceId = null;

  // Управление уведомлениями
  let notificationPermissionGranted = false;
  let notifiedSessions = new Map(); // key: "raceId_startTime" -> true

  function requestNotificationPermission() {
    if (!("Notification" in window)) {
      alert("Ваш браузер не поддерживает уведомления");
      return;
    }
    if (Notification.permission === "granted") {
      notificationPermissionGranted = true;
      document.getElementById("notificationBell").style.display = "none";
      showNotification("🔔 Уведомления включены", "Вы будете получать оповещения за 5 минут до старта гонок");
    } else if (Notification.permission !== "denied") {
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          notificationPermissionGranted = true;
          document.getElementById("notificationBell").style.display = "none";
          showNotification("🔔 Уведомления включены", "Вы будете получать оповещения за 5 минут до старта гонок");
        } else {
          document.getElementById("notificationBell").style.display = "block";
        }
      });
    } else {
      document.getElementById("notificationBell").style.display = "block";
    }
  }

  function showNotification(title, body, raceId = null, startTime = null) {
    if (!notificationPermissionGranted && Notification.permission !== "granted") return;
    
    try {
      const notification = new Notification(title, {
        body: body,
        icon: "https://cdn-icons-png.flaticon.com/512/3095/3095209.png",
        silent: false,
        tag: raceId || "race-notification"
      });
      
      if (raceId) {
        notification.onclick = () => {
          window.focus();
          const card = document.querySelector(`.race-card-modern[data-race-id="${raceId}"]`);
          if (card) {
            card.style.transition = "0.3s";
            card.style.borderColor = "#ffaa44";
            card.style.boxShadow = "0 0 15px rgba(255,170,68,0.5)";
            setTimeout(() => { 
              card.style.borderColor = "";
              card.style.boxShadow = "";
            }, 3000);
          }
        };
      }
    } catch(e) { console.warn("Notification error", e); }
  }

  // Проверка и отправка уведомлений для всех гонок
  function checkAndSendNotifications() {
    if (Notification.permission !== "granted") return;
    
    const now = Date.now();
    const FIVE_MINUTES = 5 * 60 * 1000;
    const ONE_MINUTE = 60 * 1000;
    
    state.races.forEach(race => {
      // Получаем все ближайшие старты (до 3-х)
      let checkStart = now;
      for (let i = 0; i < 5; i++) {
        const nextStart = getNextRaceStart(race, checkStart);
        if (!nextStart) break;
        
        const timeToStart = nextStart - now;
        const notificationKey = `${race.id}_${nextStart}`;
        
        // Уведомление за 5 минут (или если уже меньше 5 минут и не отправляли)
        if (timeToStart > 0 && timeToStart <= FIVE_MINUTES && !notifiedSessions.has(notificationKey)) {
          notifiedSessions.set(notificationKey, true);
          
          const minutesLeft = Math.ceil(timeToStart / 60000);
          showNotification(
            `🏁 СТАРТ ЧЕРЕЗ ${minutesLeft} МИН!`,
            `${race.series} на трассе ${race.track}\nСимулятор: ${race.sim} | Длительность: ${race.duration}`,
            race.id,
            nextStart
          );
          break; // отправляем только одно уведомление на гонку за раз
        }
        
        // Переходим к следующему старту
        checkStart = nextStart + ONE_MINUTE;
      }
    });
  }

  function saveToLocal() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function loadInitialData() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        state.races = parsed.races || [];
        state.categories = parsed.categories || DEFAULT_CATEGORIES;
        if (state.races.length === 0) throw new Error("empty");
      } catch(e) { seedDemoRaces(); }
    } else {
      seedDemoRaces();
    }
    if (!state.categories.length) state.categories = [...DEFAULT_CATEGORIES];
  }

  function seedDemoRaces() {
    const now = new Date();
    const getFuture = (minutes) => new Date(now.getTime() + minutes * 60000).toISOString();
    state.races = [
      { id: crypto.randomUUID(), sim: "ACC", series: "GT3 Sprint", track: "Spa-Francorchamps", categories: ["GT3"], rating: "Rookie (D4.0)", duration: 20, start: getFuture(4), interval: 30, validUntil: getFuture(2880), excludeTimes: [] },
      { id: crypto.randomUUID(), sim: "iRacing", series: "FIA Formula 4", track: "Silverstone", categories: ["Formula Vee"], rating: "Rookie", duration: 25, start: getFuture(8), interval: 60, validUntil: getFuture(4320), excludeTimes: [] },
      { id: crypto.randomUUID(), sim: "LMU", series: "Hypercar Challenge", track: "Le Mans", categories: ["HY"], rating: "C 2.0+", duration: 45, start: getFuture(12), interval: 120, validUntil: getFuture(7200), excludeTimes: ["02:00","03:00"] },
      { id: crypto.randomUUID(), sim: "AC Evo", series: "Nordschleife Tourist", track: "Nürburgring Nordschleife", categories: ["PCUP"], rating: "Any", duration: 18, start: getFuture(20), interval: 0, validUntil: null, excludeTimes: [] },
      { id: crypto.randomUUID(), sim: "AMS2", series: "GT1 Classics", track: "Interlagos", categories: ["GT3", "Prototype"], rating: "C", duration: 30, start: getFuture(35), interval: 45, validUntil: getFuture(10000), excludeTimes: [] },
      { id: crypto.randomUUID(), sim: "AC", series: "Drift Kings", track: "Ebisu Minami", categories: ["GT4"], rating: "Pro", duration: 15, start: getFuture(50), interval: 50, validUntil: getFuture(5000), excludeTimes: [] },
      { id: crypto.randomUUID(), sim: "Rennsport", series: "Porsche Cup", track: "Road Atlanta", categories: ["PCUP"], rating: "B", duration: 22, start: getFuture(65), interval: 35, validUntil: getFuture(8000), excludeTimes: [] },
      { id: crypto.randomUUID(), sim: "PMR", series: "Rallycross Open", track: "Barcelona RX", categories: ["M2"], rating: "Rookie", duration: 12, start: getFuture(80), interval: 0, validUntil: null, excludeTimes: [] }
    ];
    saveToLocal();
  }

  function getNextRaceStart(race, fromTimestamp = Date.now()) {
    const startTime = new Date(race.start).getTime();
    const validUntil = race.validUntil ? new Date(race.validUntil).getTime() : Infinity;
    if (fromTimestamp > validUntil) return null;
    if (!race.interval || race.interval <= 0) return startTime >= fromTimestamp ? startTime : null;
    const intervalMs = race.interval * 60 * 1000;
    let next = startTime;
    if (fromTimestamp > startTime) {
      const steps = Math.ceil((fromTimestamp - startTime) / intervalMs);
      next = startTime + steps * intervalMs;
    }
    if (next > validUntil) return null;
    if (race.excludeTimes && race.excludeTimes.length) {
      let temp = new Date(next);
      let attempts = 0;
      while(race.excludeTimes.includes(`${String(temp.getHours()).padStart(2,'0')}:${String(temp.getMinutes()).padStart(2,'0')}`)) {
        next += intervalMs;
        temp = new Date(next);
        if (next > validUntil || attempts++ > 200) return null;
      }
    }
    return next;
  }

  function getFutureSessions(race, count = 3) {
    let results = [];
    let cursor = Date.now();
    for(let i=0; i<count; i++) {
      const next = getNextRaceStart(race, cursor);
      if(!next) break;
      results.push(next);
      cursor = next + 60000;
    }
    return results;
  }

  function formatDateTime(ts) {
    const d = new Date(ts);
    return `${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
  }

  function getCountdownText(ts) {
    const diff = ts - Date.now();
    if (diff <= 0) return "⚡ СТАРТ!";
    const mins = Math.floor(diff / 60000);
    const secs = Math.floor((diff % 60000)/1000);
    if (mins >= 60) return `${Math.floor(mins/60)}ч ${mins%60}м`;
    if (mins > 0) return `${mins}м ${secs}с`;
    return `${secs}с`;
  }

  function getCountdownClass(ts) {
    const diff = ts - Date.now();
    if (diff <= 0) return "countdown-live";
    if (diff < 10 * 60 * 1000) return "countdown-soon";
    return "countdown-normal";
  }

  // Установка напоминания вручную (кнопка "Напомнить")
  function setManualReminder(race) {
    if (Notification.permission !== "granted") {
      requestNotificationPermission();
      setTimeout(() => {
        if (Notification.permission === "granted") setManualReminder(race);
        else alert("Пожалуйста, разрешите уведомления для использования этой функции");
      }, 500);
      return;
    }
    
    const nextStart = getNextRaceStart(race, Date.now());
    if (!nextStart) {
      showNotification("⚠️ Нет ближайших стартов", `У гонки "${race.series}" нет активных стартов в ближайшее время`);
      return;
    }
    
    const timeToStart = nextStart - Date.now();
    if (timeToStart <= 0) {
      showNotification("🏁 Гонка уже началась!", `${race.series} на ${race.track} уже в процессе!`);
      return;
    }
    
    const minutesLeft = Math.ceil(timeToStart / 60000);
    const secondsLeft = Math.floor((timeToStart % 60000) / 1000);
    
    let timeText = "";
    if (minutesLeft >= 60) {
      timeText = `${Math.floor(minutesLeft/60)}ч ${minutesLeft%60}м`;
    } else if (minutesLeft > 0) {
      timeText = `${minutesLeft}м ${secondsLeft}с`;
    } else {
      timeText = `${secondsLeft}с`;
    }
    
    showNotification(
      `🔔 НАПОМИНАНИЕ: ${race.series}`,
      `Старт через ${timeText} на трассе ${race.track}\nСимулятор: ${race.sim} | Длительность: ${race.duration}`,
      race.id,
      nextStart
    );
    
    // Визуальная обратная связь
    const card = document.querySelector(`.race-card-modern[data-race-id="${race.id}"]`);
    if (card) {
      card.style.transition = "0.2s";
      card.style.borderColor = "#ffaa44";
      card.style.boxShadow = "0 0 15px rgba(255,170,68,0.5)";
      setTimeout(() => { 
        card.style.borderColor = "";
        card.style.boxShadow = "";
      }, 1500);
    }
  }

  function renderSimSelector() {
    const container = document.getElementById("simSelector");
    container.innerHTML = SIMS.map(sim => `
      <div class="sim-icon-card ${activeSimFilter === sim ? 'active' : ''}" data-sim="${sim}">
        <img src="${SIM_ICON_MAP[sim]}" alt="${sim}" onerror="this.src='icons/all.png'">
        <span>${sim}</span>
      </div>
    `).join('');
    document.querySelectorAll("[data-sim]").forEach(el => {
      el.addEventListener("click", (e) => {
        activeSimFilter = el.getAttribute("data-sim");
        renderSimSelector();
        renderRaceGrid();
      });
    });
  }

  function renderCategoryFilters() {
    const container = document.getElementById("categoryFilterList");
    container.innerHTML = state.categories.map(cat => `
      <div class="pill ${activeCategoriesSet.has(cat) ? 'active-pill' : ''}" data-cat="${cat}">${cat}</div>
    `).join('');
    document.querySelectorAll("[data-cat]").forEach(el => {
      el.addEventListener("click", () => {
        const cat = el.getAttribute("data-cat");
        if (activeCategoriesSet.has(cat)) activeCategoriesSet.delete(cat);
        else activeCategoriesSet.add(cat);
        renderCategoryFilters();
        renderRaceGrid();
      });
    });
  }

  function renderRaceGrid() {
    const now = Date.now();
    let filtered = state.races.filter(race => {
      if (activeSimFilter !== "All races" && race.sim !== activeSimFilter) return false;
      if (activeCategoriesSet.size > 0 && !race.categories.some(c => activeCategoriesSet.has(c))) return false;
      const next = getNextRaceStart(race, now);
      if (!next) return false;
      return true;
    }).map(race => ({ race, nextStart: getNextRaceStart(race, now) }));
    
    if (searchQuery.trim()) {
      const q = searchQuery.toLowerCase();
      filtered = filtered.filter(({race}) => race.series.toLowerCase().includes(q) || race.track.toLowerCase().includes(q));
    }
    filtered.sort((a,b) => a.nextStart - b.nextStart);

    const container = document.getElementById("raceGridContainer");
    if (filtered.length === 0) {
      container.innerHTML = `<div style="background:#0e152e; border-radius:48px; padding:32px; text-align:center;">🏎️ Нет гонок по заданным фильтрам. Добавьте новую!</div>`;
    } else {
      container.innerHTML = filtered.map(({race}) => {
        const sessions = getFutureSessions(race, 3);
        const first = sessions[0];
        return `
          <div class="race-card-modern" data-race-id="${race.id}">
            <div class="race-preview">
              <img class="sim-icon-sm" src="${SIM_ICON_MAP[race.sim]}" alt="${race.sim}" onerror="this.src='icons/all.png'">
              <div class="tag-next">🏁 ${formatDateTime(first)}</div>
            </div>
            <div class="race-info">
              <div class="race-title">${escapeHtml(race.series)}</div>
              <div class="track-name">📍 ${escapeHtml(race.track)}</div>
              <div class="meta-strip">
                ${race.categories.map(c => `<span class="meta-badge">${escapeHtml(c)}</span>`).join('')}
                ${race.rating ? `<span class="meta-badge">⭐ ${escapeHtml(race.rating)}</span>` : ''}
                <span class="meta-badge">⏱️ ${race.duration}</span>
              </div>
              <div class="next-sessions">
                ${sessions.map(ts => `
                  <div class="session-time">
                    <span>${formatDateTime(ts)}</span>
                    <span class="${getCountdownClass(ts)}">${getCountdownText(ts)}</span>
                  </div>
                `).join('')}
              </div>
              <div class="card-actions">
                <button class="reminder-btn" data-id="${race.id}">🔔 Напомнить</button>
                <button class="edit-race" data-id="${race.id}">✏️ Изменить</button>
                <button class="delete-race" data-id="${race.id}">🗑 Удалить</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
    
    // Привязываем обработчики — ПРАВИЛЬНЫЙ СПОСОБ
    document.querySelectorAll('.reminder-btn').forEach(btn => {
      btn.removeEventListener('click', reminderHandler);
      btn.addEventListener('click', reminderHandler);
    });
    document.querySelectorAll('.edit-race').forEach(btn => {
      btn.removeEventListener('click', editHandler);
      btn.addEventListener('click', editHandler);
    });
    document.querySelectorAll('.delete-race').forEach(btn => {
      btn.removeEventListener('click', deleteHandler);
      btn.addEventListener('click', deleteHandler);
    });
    
    updateStats();
  }
  
  // Отдельные обработчики для кнопок
  function reminderHandler(e) {
    e.stopPropagation();
    const id = this.getAttribute('data-id');
    const race = state.races.find(r => r.id === id);
    if (race) setManualReminder(race);
  }
  
  function editHandler(e) {
    e.stopPropagation();
    const id = this.getAttribute('data-id');
    openModalForEdit(id);
  }
  
  function deleteHandler(e) {
    e.stopPropagation();
    const id = this.getAttribute('data-id');
    if(confirm('Удалить гонку навсегда?')) {
      state.races = state.races.filter(r => r.id !== id);
      saveToLocal();
      renderRaceGrid();
      updateStats();
    }
  }

  function updateStats() {
    const now = Date.now();
    const activeRaces = state.races.filter(r => getNextRaceStart(r, now) !== null).length;
    const soonCount = state.races.filter(r => {
      const next = getNextRaceStart(r, now);
      return next && (next - now) < 30 * 60 * 1000;
    }).length;
    document.getElementById("statTotal").innerText = activeRaces;
    document.getElementById("statSoon").innerText = soonCount;
  }

  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

  const modal = document.getElementById("raceModal");
  const modalTitle = document.getElementById("modalTitle");
  function closeModal() { modal.style.display = "none"; editingRaceId = null; }

  function renderCategorySelectorInModal(selectedCats = []) {
    const container = document.getElementById("modalCategorySelector");
    container.innerHTML = state.categories.map(cat => `
      <div class="cat-option ${selectedCats.includes(cat) ? 'selected-cat' : ''}" data-cat-val="${cat}">${cat}</div>
    `).join('');
    container.querySelectorAll(".cat-option").forEach(el => {
      el.addEventListener("click", () => el.classList.toggle("selected-cat"));
    });
  }

  function getSelectedCategoriesFromModal() {
    const selected = [];
    document.querySelectorAll("#modalCategorySelector .cat-option.selected-cat").forEach(el => {
      selected.push(el.getAttribute("data-cat-val"));
    });
    return selected;
  }

  function populateModalSimSelect() {
    const select = document.getElementById("modalSim");
    select.innerHTML = SIMS.filter(s => s !== "All races").map(sim => `<option value="${sim}">${sim}</option>`).join('');
  }

  function openModalForEdit(id) {
    const race = state.races.find(r => r.id === id);
    if (!race) return;
    editingRaceId = id;
    modalTitle.innerText = "✏️ Редактировать гонку";
    document.getElementById("modalSim").value = race.sim;
    document.getElementById("modalSeries").value = race.series;
    document.getElementById("modalTrack").value = race.track;
    document.getElementById("modalRating").value = race.rating || "";
    document.getElementById("modalDuration").value = race.duration;
    document.getElementById("modalStart").value = race.start.slice(0,16);
    document.getElementById("modalInterval").value = race.interval || 0;
    document.getElementById("modalValidUntil").value = race.validUntil ? race.validUntil.slice(0,16) : "";
    document.getElementById("modalExclude").value = (race.excludeTimes || []).join(", ");
    renderCategorySelectorInModal(race.categories);
    modal.style.display = "flex";
  }

  function openAddModal() {
    editingRaceId = null;
    modalTitle.innerText = "🏁 Новая гонка";
    document.getElementById("modalSim").value = (activeSimFilter !== "All races" ? activeSimFilter : "ACC");
    document.getElementById("modalSeries").value = "";
    document.getElementById("modalTrack").value = "";
    document.getElementById("modalRating").value = "";
    document.getElementById("modalDuration").value = 20;
    const defaultStart = new Date(Date.now() + 60*60000).toISOString().slice(0,16);
    document.getElementById("modalStart").value = defaultStart;
    document.getElementById("modalInterval").value = 0;
    document.getElementById("modalValidUntil").value = "";
    document.getElementById("modalExclude").value = "";
    renderCategorySelectorInModal([]);
    modal.style.display = "flex";
  }

  function saveRaceFromModal() {
    const sim = document.getElementById("modalSim").value;
    const series = document.getElementById("modalSeries").value.trim();
    const track = document.getElementById("modalTrack").value.trim();
    const rating = document.getElementById("modalRating").value.trim();
    const duration = parseInt(document.getElementById("modalDuration").value);
    const start = document.getElementById("modalStart").value;
    const interval = parseInt(document.getElementById("modalInterval").value) || 0;
    const validUntil = document.getElementById("modalValidUntil").value || null;
    const excludeRaw = document.getElementById("modalExclude").value;
    const excludeTimes = excludeRaw.split(",").map(s=>s.trim()).filter(Boolean);
    const categories = getSelectedCategoriesFromModal();
    if(!series || !track || !start || categories.length === 0) {
      alert("Заполните серию, трассу, категорию и дату старта");
      return;
    }
    const raceObj = {
      id: editingRaceId || crypto.randomUUID(),
      sim, series, track, categories, rating: rating || null,
      duration, start, interval, validUntil: validUntil || null,
      excludeTimes
    };
    if(editingRaceId) {
      const idx = state.races.findIndex(r=>r.id === editingRaceId);
      if(idx !== -1) state.races[idx] = raceObj;
    } else {
      state.races.push(raceObj);
    }
    saveToLocal();
    closeModal();
    renderRaceGrid();
  }

  function exportJson() {
    const data = JSON.stringify({ races: state.races, categories: state.categories }, null, 2);
    const blob = new Blob([data], {type: "application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "simrace_schedule.json";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function importJson(file) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const json = JSON.parse(ev.target.result);
        if(json.races && Array.isArray(json.races)) state.races = json.races.map(r => ({...r, id: r.id || crypto.randomUUID()}));
        if(json.categories && Array.isArray(json.categories)) state.categories = json.categories;
        saveToLocal();
        renderCategoryFilters();
        renderRaceGrid();
        alert("Импорт завершён");
      } catch(e) { alert("Неверный файл"); }
    };
    reader.readAsText(file);
  }

  function addNewCategory() {
    const inp = document.getElementById("newCatInput");
    const newCat = inp.value.trim();
    if(!newCat) return;
    if(state.categories.includes(newCat)) { alert("Уже есть"); return; }
    state.categories.push(newCat);
    saveToLocal();
    renderCategoryFilters();
    renderCategorySelectorInModal(getSelectedCategoriesFromModal());
    inp.value = "";
  }

  function updateClock() {
    document.getElementById("liveClock").innerHTML = new Date().toLocaleString();
  }

  function bindEvents() {
    document.getElementById("clearFiltersBtn").onclick = () => {
      activeCategoriesSet.clear();
      searchQuery = "";
      document.getElementById("searchField").value = "";
      renderCategoryFilters();
      renderRaceGrid();
    };
    document.getElementById("addRaceModalBtn").onclick = openAddModal;
    document.getElementById("exportDataBtn").onclick = exportJson;
    document.getElementById("importDataBtn").onclick = () => document.getElementById("importFileInput").click();
    document.getElementById("importFileInput").onchange = (e) => { if(e.target.files[0]) importJson(e.target.files[0]); e.target.value = ''; };
    document.getElementById("closeModalBtn").onclick = closeModal;
    document.getElementById("saveRaceBtn").onclick = saveRaceFromModal;
    document.getElementById("addNewCategoryBtn").onclick = addNewCategory;
    document.getElementById("searchField").addEventListener("input", (e) => { searchQuery = e.target.value; renderRaceGrid(); });
    document.getElementById("notificationBell").onclick = () => requestNotificationPermission();
    window.onclick = (e) => { if(e.target === modal) closeModal(); };
    
    setInterval(() => { 
      renderRaceGrid(); 
      updateClock();
      checkAndSendNotifications();
    }, 2000);
  }

  function init() {
    loadInitialData();
    populateModalSimSelect();
    renderSimSelector();
    renderCategoryFilters();
    bindEvents();
    renderRaceGrid();
    updateClock();
    
    // Проверяем статус уведомлений
    setTimeout(() => {
      if (Notification.permission === "default") {
        document.getElementById("notificationBell").style.display = "block";
      } else if (Notification.permission === "granted") {
        notificationPermissionGranted = true;
        document.getElementById("notificationBell").style.display = "none";
      } else if (Notification.permission === "denied") {
        document.getElementById("notificationBell").style.display = "block";
        document.getElementById("notificationBell").textContent = "🔔 Уведомления заблокированы";
      }
    }, 1000);
  }

  init();
</script>
</body>
</html>
