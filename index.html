<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>LMU Portal Style — Expandable Schedule | Next 10 Start Times</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0f17;
      font-family: 'Inter', system-ui, sans-serif;
      color: #eef2ff;
      padding-bottom: 50px;
    }
    .top-nav {
      background: #0f121c;
      border-bottom: 1px solid #1e293b;
      padding: 12px 28px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }
    .logo h1 {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(130deg, #e2ffb0, #b6ff4e);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .logo p { font-size: 0.7rem; color: #8b9bc2; }
    .quick-stats {
      background: #0c1020c9;
      backdrop-filter: blur(8px);
      padding: 6px 20px;
      border-radius: 60px;
      display: flex;
      gap: 24px;
    }
    .quick-stats div { text-align: center; font-size: 0.75rem; color: #9ca3c0; }
    .quick-stats span { font-size: 1.3rem; font-weight: 800; color: #c4ff7a; display: block; }
    .tabs-row {
      background: #0c1020aa;
      backdrop-filter: blur(12px);
      margin: 20px 28px 0 28px;
      border-radius: 16px;
      padding: 6px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: transparent;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.85rem;
      color: #9ca3c0;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active { background: linear-gradient(135deg, #7c3aed, #6d28d9); color: white; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3); }
    .sim-strip { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 28px 16px 28px; align-items: center; }
    .sim-tile {
      background: #0f1422dd;
      border: 1px solid #283153;
      border-radius: 40px;
      padding: 6px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sim-tile.active-sim { background: linear-gradient(135deg, #1a274a, #0e1732); border-color: #aaff66; box-shadow: 0 0 8px #aaff6655; }
    .add-sim-btn { background: #1e293b; border: 1px dashed #7c3aed; border-radius: 40px; padding: 6px 16px; font-size: 0.75rem; cursor: pointer; }
    .filter-bar {
      background: #0c1020aa;
      backdrop-filter: blur(12px);
      margin: 0 28px 24px 28px;
      border-radius: 56px;
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }
    .search-wrap { flex: 2; min-width: 200px; }
    .search-wrap input { width: 100%; background: #010318; border: 1px solid #323f6b; border-radius: 40px; padding: 10px 18px; color: white; outline: none; }
    .filter-group { display: flex; gap: 12px; flex-wrap: wrap; }
    .custom-select {
      background: #010318;
      border: 1px solid #323f6b;
      border-radius: 40px;
      padding: 8px 16px;
      font-size: 0.8rem;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge { background: #7c3aed; border-radius: 20px; padding: 2px 8px; font-size: 0.7rem; }
    .dropdown { position: relative; }
    .dropdown-menu {
      position: absolute;
      top: 110%;
      left: 0;
      background: #0f1629;
      border: 1px solid #4c1d95;
      border-radius: 16px;
      padding: 8px;
      min-width: 160px;
      z-index: 100;
      backdrop-filter: blur(8px);
      display: none;
    }
    .dropdown-menu.open { display: block; }
    .dropdown-menu label { display: flex; align-items: center; gap: 8px; padding: 6px 12px; font-size: 0.8rem; cursor: pointer; }
    .action-buttons { display: flex; gap: 10px; margin-left: auto; }
    .btn-outline {
      background: #111a2f;
      border: 1px solid #475e8f;
      border-radius: 40px;
      padding: 6px 16px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.1s;
    }
    .btn-outline.green { background: #a3ff4e18; border-color: #a3ff4e; color: #d4ffa5; }
    .btn-outline:hover { background: #1f2a4a; transform: scale(0.97); }
    .table-wrapper { margin: 0 28px; background: #0f1629; border-radius: 20px; border: 1px solid #2d3b5a; overflow-x: auto; }
    .race-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 1050px; }
    .race-table th { text-align: left; padding: 14px 16px; background: #0a0f1a; color: #8f9bb3; font-weight: 600; font-size: 0.7rem; text-transform: uppercase; border-bottom: 1px solid #1e2a4a; }
    .race-table td { padding: 14px 16px; border-bottom: 1px solid #1e2a4a; vertical-align: middle; }
    .race-table tr.main-row { cursor: pointer; transition: background 0.15s; }
    .race-table tr.main-row:hover { background: #1a2442; }
    .expandable-row { background: #0a0f1a; }
    .expandable-row td { padding: 0 !important; }
    .expandable-content { padding: 16px 24px; background: #0d1222; border-top: 1px solid #2d3b5a; }
    .sessions-list { display: flex; flex-direction: column; gap: 6px; }
    .session-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 8px 12px;
      background: #0f1629;
      border-radius: 12px;
      font-size: 0.8rem;
    }
    .session-time { font-family: 'JetBrains Mono', monospace; font-weight: 600; min-width: 140px; }
    .session-countdown { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }
    .session-live { color: #ff6b6b; }
    .session-soon { color: #ffbb44; }
    .session-normal { color: #a0ffa0; }
    .timer-cell { font-family: 'JetBrains Mono', monospace; font-weight: 600; }
    .timer-main { font-size: 1rem; font-weight: 700; letter-spacing: -0.5px; }
    .timer-sub { font-size: 0.65rem; opacity: 0.8; margin-top: 2px; }
    .timer-live { color: #ff6b6b; }
    .timer-soon { color: #ffbb44; }
    .timer-normal { color: #a0ffa0; }
    .hourglass-icon { display: inline-block; margin-right: 6px; font-size: 0.8rem; }
    .sr-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.7rem;
      gap: 6px;
      color: white;
      text-shadow: 0 0 1px rgba(0,0,0,0.3);
    }
    .event-type-badge {
      display: inline-block;
      font-size: 0.6rem;
      padding: 2px 8px;
      border-radius: 20px;
      margin-left: 8px;
    }
    .event-daily { background: #3b82f6; }
    .event-weekly { background: #8b5cf6; }
    .event-special { background: #ef4444; }
    .sim-logo { display: flex; align-items: center; gap: 8px; }
    .car-class-chip { display: inline-block; background: #1e293b; border: 1px solid #7c3aed; border-radius: 20px; padding: 2px 10px; font-size: 0.7rem; font-weight: 600; margin-right: 6px; margin-bottom: 4px; }
    .reminder-btn, .edit-btn, .delete-btn { background: none; border: none; color: #a0afd0; font-size: 1.1rem; cursor: pointer; margin: 0 4px; transition: 0.1s; }
    .reminder-btn:hover { color: #ffcc44; }
    .edit-btn:hover { color: #7c3aed; }
    .delete-btn:hover { color: #ff5555; }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: #0f1629;
      border: 1px solid #4c1d95;
      border-radius: 28px;
      width: 90%;
      max-width: 780px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 28px;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field input, .form-field select { background: #010318; border: 1px solid #2d4270; padding: 10px 14px; border-radius: 24px; color: white; }
    .duration-group { display: flex; gap: 10px; }
    .duration-group input { flex: 2; }
    .duration-group select { flex: 1; }
    .schedule-type { display: flex; gap: 16px; margin-bottom: 12px; }
    .schedule-type label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .times-list { background: #0a0d14; border-radius: 16px; padding: 12px; margin-top: 8px; }
    .time-tag { display: inline-flex; align-items: center; gap: 6px; background: #1e293b; border-radius: 30px; padding: 4px 10px; margin: 4px; font-size: 0.75rem; }
    .time-tag button { background: none; border: none; color: #ff8888; cursor: pointer; margin-left: 6px; }
    .cat-selector { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .cat-opt { background: #101d3a; padding: 5px 12px; border-radius: 30px; font-size: 0.75rem; cursor: pointer; }
    .cat-opt.selected { background: #aaff55; color: #091c00; }
    .add-cat { display: flex; gap: 8px; margin: 12px 0; }
    .add-cat input { flex: 1; background: #010318; border: 1px solid #2d4270; border-radius: 24px; padding: 8px 12px; }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
    @media (max-width: 800px) { .filter-bar { flex-direction: column; align-items: stretch; } .table-wrapper { margin: 0 16px; } }
  </style>
</head>
<body>

<div class="top-nav">
  <div class="logo"><h1>🏁 RACE SERIES HUB</h1><p>expandable schedule · next 10 start times · iRacing+LFM colors</p></div>
  <div class="quick-stats"><div><span id="totalRaces">0</span>Upcoming</div><div><span id="soonRaces">0</span>Next 30min</div></div>
</div>

<div class="tabs-row">
  <button class="tab-btn active" data-view="series">Race Series</button>
  <button class="tab-btn" data-view="all">All Upcoming</button>
  <button class="tab-btn" data-view="weekly">Weekly Races</button>
  <button class="tab-btn" data-view="special">Special Events</button>
</div>

<div class="sim-strip" id="simFilterStrip"></div>

<div class="filter-bar">
  <div class="search-wrap"><input type="text" id="searchInput" placeholder="🔍 Search races..."></div>
  <div class="filter-group">
    <div class="dropdown" id="srDropdown"><div class="custom-select">SR ▼ <span id="srBadgeCount"></span></div><div class="dropdown-menu" id="srMenu"></div></div>
    <div class="dropdown" id="classDropdown"><div class="custom-select">Car Class ▼ <span id="classBadgeCount"></span></div><div class="dropdown-menu" id="classMenu"></div></div>
  </div>
  <div class="action-buttons">
    <div class="btn-outline green" id="clearFiltersBtn">✖ Clear</div>
    <div class="btn-outline" id="addRaceBtn">+ Add Race</div>
    <div class="btn-outline" id="exportBtn">💾 JSON</div>
    <input type="file" id="importFile" style="display:none" accept=".json">
    <div class="btn-outline" id="importBtn">📂 Import</div>
  </div>
</div>

<div class="table-wrapper">
  <table class="race-table" id="raceTable">
    <thead><tr><th>START TIME</th><th>SR</th><th>SIM</th><th>SERIES</th><th>TRACK</th><th>CARS</th><th>DURATION</th><th></th></tr></thead>
    <tbody id="raceTableBody"></tbody>
  </table>
</div>

<div id="modal" class="modal-overlay">
  <div class="modal-card">
    <h3 id="modalTitle" style="margin-bottom: 20px;">➕ New Race Session</h3>
    <div class="form-grid">
      <div class="form-field">
        <label>Simulator</label>
        <div style="display:flex; gap:8px;"><select id="modalSim" style="flex:1"></select><button type="button" class="btn-outline" id="addSimBtn" style="padding:6px 12px;">➕ New</button></div>
      </div>
      <div class="form-field"><label>Series</label><input id="modalSeries" placeholder="GT3 Sprint"></div>
      <div class="form-field"><label>Track</label><input id="modalTrack" placeholder="Spa"></div>
      <div class="form-field">
        <label>SR / License</label>
        <select id="modalRating" style="width:100%"></select>
      </div>
      <div class="form-field"><label>Event Type</label><select id="modalEventType"><option value="Daily">Daily</option><option value="Weekly">Weekly</option><option value="Special Event">Special Event</option></select></div>
      <div class="form-field"><label>Duration</label><div class="duration-group"><input type="number" id="modalDurationValue" value="20" step="1" min="1"><select id="modalDurationType"><option value="minutes">minutes</option><option value="laps">laps</option></select></div></div>
      <div class="form-field"><label>Start Type</label><div class="schedule-type"><label><input type="radio" name="scheduleType" value="interval" checked> Interval (min)</label><label><input type="radio" name="scheduleType" value="list"> Custom times</label></div></div>
    </div>
    <div id="intervalSection">
      <div class="form-grid">
        <div class="form-field"><label>First start</label><input id="modalStart" type="datetime-local"></div>
        <div class="form-field"><label>Interval (minutes)</label><input id="modalInterval" type="number" value="0"></div>
        <div class="form-field"><label>Valid until (optional)</label><input id="modalUntil" type="datetime-local"></div>
      </div>
      <div class="form-field"><label>Exclude times (HH:MM, comma separated)</label><input id="modalExclude" placeholder="14:00, 18:30, 22:00"></div>
    </div>
    <div id="customTimesSection" style="display:none">
      <div class="form-field"><label>Custom start times (HH:MM, 24h format)</label><div style="display:flex; gap:8px;"><input type="text" id="customTimeInput" placeholder="14:30" style="flex:1"><button type="button" class="btn-outline" id="addCustomTimeBtn">➕ Add time</button></div></div>
      <div id="customTimesList" class="times-list"></div>
      <div class="form-field" style="margin-top:8px"><label>First date for custom times</label><input id="modalCustomStartDate" type="date"></div>
    </div>
    
    <label>Car Classes:</label>
    <div id="modalCatContainer" class="cat-selector"></div>
    <div class="add-cat"><input type="text" id="newCatInput" placeholder="New class (e.g. HYPERCAR)"><button type="button" class="btn-outline" id="addNewCatBtn">+ Add class</button></div>
    
    <div class="modal-buttons">
      <div class="btn-outline" id="closeModal">Cancel</div>
      <div class="btn-outline green" id="saveModal">Save</div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = "lmu_expandable_schedule_v8";
  
  const SR_LISTS = {
    "LMU": ["Bronze", "Silver", "Gold"],
    "iRacing": ["R", "D", "C", "B", "A"],
    "ACC": ["F", "E", "D", "C", "B", "A", "S"],
    "AC": ["F", "E", "D", "C", "B", "A", "S"],
    "AMS2": ["F", "E", "D", "C", "B", "A", "S"],
    "AC Evo": ["F", "E", "D", "C", "B", "A", "S"],
    "Rennsport": ["F", "E", "D", "C", "B", "A", "S"],
    "rFactor2": ["Rookie", "Amateur", "Pro"]
  };
  
  const IRACING_COLORS = { "R": "#dc2626", "D": "#f97316", "C": "#eab308", "B": "#22c55e", "A": "#3b82f6" };
  const LFM_COLORS = { "F": "#dc2626", "E": "#9ca3af", "D": "#f97316", "C": "#f8fafc", "B": "#eab308", "A": "#a855f7", "S": "#22c55e" };
  const LMU_COLORS = { "Bronze": "#977548", "Silver": "#8f9499", "Gold": "#f5b042" };

  function getSrColor(sr, sim) {
    if (sim === "iRacing") return IRACING_COLORS[sr] || "#6b7280";
    if (sim === "LMU") return LMU_COLORS[sr] || "#8f9499";
    if (["ACC","AC","AMS2","AC Evo","Rennsport"].includes(sim)) return LFM_COLORS[sr] || "#9ca3af";
    return "#7c3aed";
  }

  function migrateDuration(dur) {
    if (!dur) return { value: 20, type: "minutes" };
    if (typeof dur === 'number') return { value: dur, type: "minutes" };
    if (typeof dur === 'object' && dur.type) return dur;
    return { value: 20, type: "minutes" };
  }

  let appState = {
    races: [],
    categories: ["GT3", "LMP2", "LMP3", "HY", "PCUP", "GT4", "Prototype", "M2", "GCHAL"],
    simulators: ["ACC", "iRacing", "LMU", "AC Evo", "AMS2", "AC", "Rennsport"]
  };
  
  let filters = { sim: "All sims", sr: new Set(), class: new Set(), search: "", activeTab: "series" };
  let editingId = null;
  let notificationGranted = false;
  let customTimesArray = [];
  let expandedRowId = null;

  function getSrListForSim(sim) { return SR_LISTS[sim] || ["Bronze", "Silver", "Gold"]; }

  // Get next N start times for a race
  function getNextStartTimes(race, fromTime = Date.now(), limit = 10) {
    const times = [];
    let cursor = fromTime;
    for (let i = 0; i < limit * 2 && times.length < limit; i++) {
      const next = getNextStart(race, cursor);
      if (!next) break;
      times.push(next);
      cursor = next + 60000; // move 1 min forward to get next
    }
    return times;
  }

  function getNextStart(race, from = Date.now()) {
    if (race.customTimes && race.customTimes.length > 0) {
      let baseDate = race.customStartDate ? new Date(race.customStartDate).setHours(0,0,0,0) : new Date(from).setHours(0,0,0,0);
      for (let i = 0; i < 30; i++) {
        let checkDate = baseDate + i * 86400000;
        for (let timeStr of race.customTimes) {
          let [hours, minutes] = timeStr.split(':').map(Number);
          let ts = new Date(checkDate).setHours(hours, minutes, 0, 0);
          if (ts >= from) return ts;
        }
      }
      return null;
    }
    let start = new Date(race.start).getTime();
    let until = race.validUntil ? new Date(race.validUntil).getTime() : Infinity;
    if (from > until) return null;
    if (!race.interval || race.interval <= 0) return start >= from ? start : null;
    let step = race.interval * 60000;
    let next = start;
    if (from > start) { let steps = Math.ceil((from - start) / step); next = start + steps * step; }
    if (next > until) return null;
    if (race.excludeTimes && race.excludeTimes.length) {
      let d = new Date(next);
      let timeKey = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      if (race.excludeTimes.includes(timeKey)) {
        let candidate = next + step;
        if (candidate > until) return null;
        return candidate;
      }
    }
    return next;
  }

  function formatCountdown(ts) {
    const diff = ts - Date.now();
    if (diff <= 0) return { text: "LIVE", className: "session-live" };
    const totalSeconds = Math.floor(diff / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    if (hours > 0) return { text: `${hours}h ${minutes.toString().padStart(2,'0')}m`, className: diff < 10*60000 ? "session-soon" : "session-normal" };
    if (minutes > 0) return { text: `${minutes}:${seconds.toString().padStart(2,'0')}`, className: diff < 10*60000 ? "session-soon" : "session-normal" };
    return { text: `${seconds}s`, className: "session-soon" };
  }

  function formatFullDateTime(ts) {
    let d = new Date(ts);
    return `${d.toLocaleDateString([], {month:'2-digit', day:'2-digit'})} ${d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
  }

  function formatStartTime(ts) { 
    let d = new Date(ts); 
    return `${d.toLocaleDateString([],{month:'2-digit',day:'2-digit'})} ${d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}`; 
  }
  
  function formatDuration(d) { return d.type === 'laps' ? `${d.value} laps` : `${d.value}m`; }
  function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

  function toggleExpandRow(raceId) {
    if (expandedRowId === raceId) {
      expandedRowId = null;
    } else {
      expandedRowId = raceId;
    }
    renderTable();
  }

  function renderTable() {
    const now = Date.now();
    let rows = appState.races.map(r => ({ race: r, next: getNextStart(r, now) })).filter(r => r.next);
    
    if (filters.activeTab === "weekly") rows = rows.filter(r => r.race.eventType === "Weekly");
    else if (filters.activeTab === "special") rows = rows.filter(r => r.race.eventType === "Special Event");
    
    if (filters.sim !== "All sims") rows = rows.filter(r => r.race.sim === filters.sim);
    if (filters.sr.size) rows = rows.filter(r => filters.sr.has(r.race.rating));
    if (filters.class.size) rows = rows.filter(r => r.race.categories.some(c => filters.class.has(c)));
    if (filters.search) { let q = filters.search.toLowerCase(); rows = rows.filter(r => r.race.series.toLowerCase().includes(q) || r.race.track.toLowerCase().includes(q)); }
    rows.sort((a,b) => a.next - b.next);
    document.getElementById("totalRaces").innerText = rows.length;
    document.getElementById("soonRaces").innerText = rows.filter(r => (r.next - now) < 30*60000).length;
    
    const tbody = document.getElementById("raceTableBody");
    if (!rows.length) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:40px;">🏁 No races match filters. Add new session →</td></tr>'; return; }
    
    let html = '';
    for (const {race, next} of rows) {
      const srColor = getSrColor(race.rating, race.sim);
      const carClassesHtml = race.categories.map(c => `<span class="car-class-chip">${escapeHtml(c)}</span>`).join('');
      const countdown = formatCountdown(next);
      const startTimeFormatted = formatStartTime(next);
      const durationText = formatDuration(race.duration);
      const eventType = race.eventType || "Daily";
      const eventClass = eventType === "Daily" ? "event-daily" : (eventType === "Weekly" ? "event-weekly" : "event-special");
      const simIconUrl = `https://placehold.co/28x28/1e293b/white?text=${race.sim.charAt(0)}`;
      const isLightColor = race.rating === "C" && ["ACC","AC","AMS2","AC Evo","Rennsport"].includes(race.sim);
      const isExpanded = expandedRowId === race.id;
      
      html += `<tr class="main-row" data-id="${race.id}" style="cursor:pointer;">`;
      html += `<td class="timer-cell"><div class="timer-main ${countdown.className === 'session-live' ? 'timer-live' : (countdown.className === 'session-soon' ? 'timer-soon' : 'timer-normal')}"><span class="hourglass-icon">⏳</span>${startTimeFormatted}</div><div class="timer-sub">${countdown.text}</div></td>`;
      html += `<td><div class="sr-badge" style="background:${srColor}; ${isLightColor ? 'color:#1e293b; text-shadow:none;' : 'color:white;'}"><span style="background:rgba(0,0,0,0.2); padding:2px 6px; border-radius:20px;">SR</span> ${escapeHtml(race.rating)}<span class="event-type-badge ${eventClass}">${eventType}</span></div></td>`;
      html += `<td><div class="sim-logo"><img src="${simIconUrl}"><span>${escapeHtml(race.sim)}</span></div></td>`;
      html += `<td>${escapeHtml(race.series)}</td>`;
      html += `<td>${escapeHtml(race.track)}</td>`;
      html += `<td>${carClassesHtml}</td>`;
      html += `<td>${durationText}</td>`;
      html += `<td><button class="reminder-btn" data-id="${race.id}">🔔</button><button class="edit-btn" data-id="${race.id}">✏️</button><button class="delete-btn" data-id="${race.id}">🗑️</button></td>`;
      html += `</tr>`;
      
      if (isExpanded) {
        const nextTimes = getNextStartTimes(race, now + 1000, 10);
        html += `<tr class="expandable-row"><td colspan="8"><div class="expandable-content">`;
        html += `<div style="font-weight:600; margin-bottom:12px;">📅 Next 10 start times for ${escapeHtml(race.series)}</div>`;
        html += `<div class="sessions-list">`;
        if (nextTimes.length === 0) {
          html += `<div class="session-item">No upcoming sessions found</div>`;
        } else {
          for (let i = 0; i < nextTimes.length; i++) {
            const ts = nextTimes[i];
            const cd = formatCountdown(ts);
            html += `<div class="session-item">
              <span class="session-time">${formatFullDateTime(ts)}</span>
              <span class="session-countdown ${cd.className}">${cd.text}</span>
            </div>`;
          }
        }
        html += `</div></div></td></tr>`;
      }
    }
    tbody.innerHTML = html;
    
    // Attach row click handlers
    document.querySelectorAll('.main-row').forEach(row => {
      row.addEventListener('click', (e) => {
        if (e.target.classList.contains('reminder-btn') || 
            e.target.classList.contains('edit-btn') || 
            e.target.classList.contains('delete-btn')) {
          return;
        }
        const id = row.getAttribute('data-id');
        toggleExpandRow(id);
      });
    });
    
    document.querySelectorAll('.reminder-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); manualReminder(btn.dataset.id); }));
    document.querySelectorAll('.edit-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); openEdit(btn.dataset.id); }));
    document.querySelectorAll('.delete-btn').forEach(btn => btn.addEventListener('click', (e) => { e.stopPropagation(); if(confirm('Delete race?')) { appState.races = appState.races.filter(r => r.id !== btn.dataset.id); saveLocal(); renderTable(); renderFiltersUI(); } }));
  }

  function manualReminder(id) {
    if (Notification.permission !== "granted") { requestNotify(); setTimeout(() => manualReminder(id), 500); return; }
    let race = appState.races.find(r => r.id === id);
    if (!race) return;
    let next = getNextStart(race);
    if (!next) { alert("No upcoming start"); return; }
    let mins = Math.ceil((next - Date.now())/60000);
    new Notification(`🔔 Reminder: ${race.series}`, { body: `Starts in ~${mins} min at ${race.track} | ${race.eventType}`, icon: "https://cdn-icons-png.flaticon.com/512/3095/3095209.png" });
  }
  function requestNotify() { if (!("Notification" in window)) return; if (Notification.permission === "granted") notificationGranted=true; else if (Notification.permission !== "denied") Notification.requestPermission().then(p => { if(p==="granted") notificationGranted=true; }); }

  function renderFiltersUI() {
    const simContainer = document.getElementById("simFilterStrip");
    simContainer.innerHTML = `<div class="sim-tile ${filters.sim === 'All sims' ? 'active-sim' : ''}" data-sim="All sims"><span>All sims</span></div>` +
      appState.simulators.map(s => `<div class="sim-tile ${filters.sim === s ? 'active-sim' : ''}" data-sim="${s}"><span>${s}</span></div>`).join('') +
      `<div class="add-sim-btn" id="addSimulatorBtn">➕ Add Sim</div>`;
    document.querySelectorAll("[data-sim]").forEach(el => el.addEventListener("click", () => { filters.sim = el.getAttribute("data-sim"); renderFiltersUI(); renderTable(); }));
    document.getElementById("addSimulatorBtn")?.addEventListener("click", () => { let name = prompt("Enter new simulator name:"); if(name && name.trim() && !appState.simulators.includes(name.trim())) { appState.simulators.push(name.trim()); saveLocal(); renderFiltersUI(); updateModalSimSelect(); } });
    
    const allSRs = [...new Set(appState.races.map(r => r.rating).filter(Boolean))];
    const srMenu = document.getElementById("srMenu");
    srMenu.innerHTML = allSRs.map(opt => `<label><input type="checkbox" value="${opt}" ${filters.sr.has(opt) ? 'checked' : ''}> ${opt}</label>`).join('');
    srMenu.querySelectorAll("input").forEach(cb => cb.addEventListener("change", () => { filters.sr.clear(); srMenu.querySelectorAll("input:checked").forEach(inp => filters.sr.add(inp.value)); renderTable(); updateBadgeCounts(); }));
    document.getElementById("srDropdown").querySelector(".custom-select").addEventListener("click", (e) => { e.stopPropagation(); srMenu.classList.toggle("open"); });
    
    const classMenu = document.getElementById("classMenu");
    classMenu.innerHTML = appState.categories.map(c => `<label><input type="checkbox" value="${c}" ${filters.class.has(c) ? 'checked' : ''}> ${c}</label>`).join('');
    classMenu.querySelectorAll("input").forEach(cb => cb.addEventListener("change", () => { filters.class.clear(); classMenu.querySelectorAll("input:checked").forEach(inp => filters.class.add(inp.value)); renderTable(); updateBadgeCounts(); }));
    document.getElementById("classDropdown").querySelector(".custom-select").addEventListener("click", (e) => { e.stopPropagation(); classMenu.classList.toggle("open"); });
    
    document.addEventListener("click", () => { srMenu.classList.remove("open"); classMenu.classList.remove("open"); });
    updateBadgeCounts();
  }
  function updateBadgeCounts() {
    document.getElementById("srBadgeCount").innerHTML = filters.sr.size ? `<span class="badge">${filters.sr.size}</span>` : '';
    document.getElementById("classBadgeCount").innerHTML = filters.class.size ? `<span class="badge">${filters.class.size}</span>` : '';
  }

  function updateModalSimSelect() {
    const select = document.getElementById("modalSim");
    select.innerHTML = appState.simulators.map(s => `<option value="${s}">${s}</option>`).join('');
  }
  function updateSrSelect(sim) {
    const srSelect = document.getElementById("modalRating");
    const srList = getSrListForSim(sim);
    srSelect.innerHTML = srList.map(sr => `<option value="${sr}">${sr}</option>`).join('');
    if (srList.length) srSelect.value = srList[0];
  }

  function openEdit(id) { editingId = id; let race = appState.races.find(r => r.id === id); if(race) fillModal(race); else openAddModal(); }
  function openAddModal() { editingId = null; fillModal(null); }
  function fillModal(race) {
    document.getElementById("modalTitle").innerText = race ? "✏️ Edit Race" : "➕ New Race Session";
    updateModalSimSelect();
    const sim = race?.sim || "ACC";
    document.getElementById("modalSim").value = sim;
    updateSrSelect(sim);
    document.getElementById("modalSeries").value = race?.series || "";
    document.getElementById("modalTrack").value = race?.track || "";
    document.getElementById("modalRating").value = race?.rating || getSrListForSim(sim)[0];
    document.getElementById("modalEventType").value = race?.eventType || "Daily";
    const dur = race?.duration ? migrateDuration(race.duration) : { value: 20, type: "minutes" };
    document.getElementById("modalDurationValue").value = dur.value;
    document.getElementById("modalDurationType").value = dur.type;
    
    const isCustomTimes = race?.customTimes && race.customTimes.length > 0;
    document.querySelectorAll('input[name="scheduleType"]').forEach(r => r.checked = false);
    if (isCustomTimes) document.querySelector('input[value="list"]').checked = true;
    else document.querySelector('input[value="interval"]').checked = true;
    toggleScheduleType();
    
    if (isCustomTimes) {
      customTimesArray = [...(race.customTimes || [])];
      document.getElementById("modalCustomStartDate").value = race.customStartDate || new Date().toISOString().slice(0,10);
      renderCustomTimesList();
    } else {
      document.getElementById("modalStart").value = race?.start ? race.start.slice(0,16) : new Date(Date.now() + 3600000).toISOString().slice(0,16);
      document.getElementById("modalInterval").value = race?.interval || 0;
      document.getElementById("modalUntil").value = race?.validUntil?.slice(0,16) || "";
      document.getElementById("modalExclude").value = (race?.excludeTimes || []).join(", ");
    }
    renderModalCats(race?.categories || []);
    document.getElementById("modal").style.display = "flex";
  }
  function toggleScheduleType() {
    const isList = document.querySelector('input[name="scheduleType"]:checked')?.value === "list";
    document.getElementById("intervalSection").style.display = isList ? "none" : "block";
    document.getElementById("customTimesSection").style.display = isList ? "block" : "none";
  }
  function renderCustomTimesList() {
    const container = document.getElementById("customTimesList");
    container.innerHTML = customTimesArray.map((t, idx) => `<div class="time-tag">${t} <button data-idx="${idx}">✖</button></div>`).join('');
    container.querySelectorAll("button").forEach(btn => btn.addEventListener("click", (e) => { let idx = parseInt(btn.dataset.idx); customTimesArray.splice(idx,1); renderCustomTimesList(); }));
  }
  function addCustomTime() { let inp = document.getElementById("customTimeInput"); let val = inp.value.trim(); if(/^([01]\d|2[0-3]):([0-5]\d)$/.test(val)) { customTimesArray.push(val); renderCustomTimesList(); inp.value = ""; } else alert("Use HH:MM format (e.g. 14:30)"); }
  
  function renderModalCats(selected) {
    const container = document.getElementById("modalCatContainer");
    container.innerHTML = appState.categories.map(c => `<div class="cat-opt ${selected.includes(c) ? 'selected' : ''}" data-cat="${c}">${c}</div>`).join('');
    container.querySelectorAll(".cat-opt").forEach(el => el.addEventListener("click", () => el.classList.toggle("selected")));
  }
  function getSelectedModalCats() { return [...document.querySelectorAll("#modalCatContainer .cat-opt.selected")].map(el => el.getAttribute("data-cat")); }
  function addNewCategory() { let inp = document.getElementById("newCatInput"); let val = inp.value.trim(); if(!val) return; if(!appState.categories.includes(val)) { appState.categories.push(val); saveLocal(); renderModalCats(getSelectedModalCats()); renderFiltersUI(); inp.value = ""; } else alert("Category exists"); }

  function saveFromModal() {
    let sim = document.getElementById("modalSim").value;
    let series = document.getElementById("modalSeries").value.trim();
    let track = document.getElementById("modalTrack").value.trim();
    let rating = document.getElementById("modalRating").value;
    let eventType = document.getElementById("modalEventType").value;
    let durationValue = parseInt(document.getElementById("modalDurationValue").value);
    let durationType = document.getElementById("modalDurationType").value;
    let categories = getSelectedModalCats();
    if (!series || !track || categories.length === 0) { alert("Fill required fields"); return; }
    if (isNaN(durationValue) || durationValue <= 0) { alert("Duration must be > 0"); return; }
    
    let raceObj = { id: editingId || crypto.randomUUID(), sim, series, track, rating, eventType, duration: { value: durationValue, type: durationType }, categories };
    const isList = document.querySelector('input[name="scheduleType"]:checked')?.value === "list";
    if (isList) {
      if (customTimesArray.length === 0) { alert("Add at least one custom start time"); return; }
      raceObj.customTimes = customTimesArray;
      raceObj.customStartDate = document.getElementById("modalCustomStartDate").value;
      raceObj.interval = null; raceObj.start = null;
    } else {
      let start = document.getElementById("modalStart").value;
      let interval = parseInt(document.getElementById("modalInterval").value) || 0;
      let validUntil = document.getElementById("modalUntil").value || null;
      let excludeRaw = document.getElementById("modalExclude").value;
      let excludeTimes = excludeRaw.split(",").map(s=>s.trim()).filter(s=>/^([01]\d|2[0-3]):([0-5]\d)$/.test(s));
      if (!start) { alert("First start required"); return; }
      raceObj.start = start; raceObj.interval = interval; raceObj.validUntil = validUntil; raceObj.excludeTimes = excludeTimes;
      raceObj.customTimes = null;
    }
    if (editingId) { let idx = appState.races.findIndex(r => r.id === editingId); if(idx!==-1) appState.races[idx] = raceObj; }
    else appState.races.push(raceObj);
    saveLocal(); renderTable(); renderFiltersUI(); document.getElementById("modal").style.display = "none";
  }

  function saveLocal() { localStorage.setItem(STORAGE_KEY, JSON.stringify({ races: appState.races, categories: appState.categories, simulators: appState.simulators })); }
  function loadLocal() {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) {
      try { const j = JSON.parse(data); appState.races = (j.races || []).map(r => ({ ...r, duration: migrateDuration(r.duration) })); appState.categories = j.categories || appState.categories; appState.simulators = j.simulators || appState.simulators; if(!appState.races.length) seedData(); } catch(e) { seedData(); }
    } else { seedData(); }
  }
  function seedData() {
    const now = new Date(); const plus = (min) => new Date(now.getTime() + min*60000).toISOString();
    appState.races = [
      { id: crypto.randomUUID(), sim: "LMU", series: "ELMS Sprint Trophy", track: "FujiWEC", rating: "Silver", eventType: "Weekly", duration: { value: 30, type: "minutes" }, start: plus(12), interval: 90, validUntil: plus(7200), excludeTimes: [], categories: ["LMP2","LMP3"] },
      { id: crypto.randomUUID(), sim: "iRacing", series: "LMP3 Fixed", track: "MonzaWEC", rating: "C", eventType: "Daily", duration: { value: 20, type: "minutes" }, start: plus(38), interval: 60, excludeTimes: [], categories: ["LMP3"] },
      { id: crypto.randomUUID(), sim: "ACC", series: "LFM Sprint", track: "Barcelona", rating: "S", eventType: "Daily", duration: { value: 25, type: "minutes" }, start: plus(45), interval: 60, categories: ["GT3"] },
      { id: crypto.randomUUID(), sim: "iRacing", series: "IMSA Endurance", track: "Daytona", rating: "A", eventType: "Weekly", duration: { value: 45, type: "minutes" }, start: plus(120), interval: 180, categories: ["LMP2","GT3"] },
      { id: crypto.randomUUID(), sim: "ACC", series: "Special GT3 Challenge", track: "Nürburgring", rating: "B", eventType: "Special Event", duration: { value: 10, type: "laps" }, customTimes: ["14:00","18:00","22:00"], customStartDate: new Date().toISOString().slice(0,10), categories: ["GT3"] }
    ];
    saveLocal();
  }

  function exportData() { let data = JSON.stringify({ races: appState.races, categories: appState.categories, simulators: appState.simulators }, null, 2); let a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data])); a.download = "races.json"; a.click(); }
  function importData(file) { let fr = new FileReader(); fr.onload = e => { try { let j = JSON.parse(e.target.result); if(j.races) appState.races = j.races.map(r => ({ ...r, duration: migrateDuration(r.duration) })); if(j.categories) appState.categories = j.categories; if(j.simulators) appState.simulators = j.simulators; saveLocal(); renderTable(); renderFiltersUI(); alert("Imported"); } catch(err){ alert("Invalid file"); } }; fr.readAsText(file); }

  function init() {
    loadLocal();
    renderFiltersUI();
    renderTable();
    setInterval(() => renderTable(), 1000);
    document.getElementById("searchInput").addEventListener("input", (e) => { filters.search = e.target.value; renderTable(); });
    document.getElementById("clearFiltersBtn").onclick = () => { filters.sr.clear(); filters.class.clear(); filters.search = ""; document.getElementById("searchInput").value = ""; renderFiltersUI(); renderTable(); };
    document.getElementById("addRaceBtn").onclick = () => openAddModal();
    document.getElementById("closeModal").onclick = () => document.getElementById("modal").style.display = "none";
    document.getElementById("saveModal").onclick = saveFromModal;
    document.getElementById("exportBtn").onclick = exportData;
    document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
    document.getElementById("importFile").onchange = (e) => { if(e.target.files[0]) importData(e.target.files[0]); e.target.value=""; };
    document.querySelectorAll('input[name="scheduleType"]').forEach(r => r.addEventListener("change", toggleScheduleType));
    document.getElementById("addCustomTimeBtn")?.addEventListener("click", addCustomTime);
    document.getElementById("addNewCatBtn")?.addEventListener("click", addNewCategory);
    document.getElementById("modalSim")?.addEventListener("change", (e) => updateSrSelect(e.target.value));
    
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const view = btn.getAttribute("data-view");
        if (view === "weekly") filters.activeTab = "weekly";
        else if (view === "special") filters.activeTab = "special";
        else filters.activeTab = "series";
        expandedRowId = null;
        renderTable();
      });
    });
    window.onclick = (e) => { if(e.target === document.getElementById("modal")) document.getElementById("modal").style.display = "none"; };
    setTimeout(() => { if(Notification.permission === "default") requestNotify(); }, 1000);
  }
  init();
</script>
</body>
</html>
